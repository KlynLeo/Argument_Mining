": 142, "label": "142", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eEnergia nuclear\u0103 este modalitatea suprem\u0103 de centralizare a puterii, pun\u00e2nd-o \u00een m\u00e2inile exper\u021bilor, corpora\u021biilor multina\u021bionale \u0219i a guvernelor mari."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 143, "label": "143", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003e\u00cen prezent, de\u0219eurile sunt depozitate \u00een principal \u00een loca\u021bii individuale ale reactoarelor \u0219i exist\u0103 peste 430 de loca\u021bii \u00een \u00eentreaga lume \u00een care materialul radioactiv continu\u0103 s\u0103 se acumuleze."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 144, "label": "144", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eMai r\u0103u, industria nuclear\u0103 vrea s\u0103 reproceseze de\u0219eurile pentru a ob\u021bine mai mult\u0103 energie din uraniu din ce \u00een ce mai rar."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 145, "label": "145", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eDe\u0219i niciuna dintre problemele de siguran\u021b\u0103 nu a afectat angaja\u021bii fabricii sau publicul, acestea au ap\u0103rut cu o frecven\u021b\u0103 alarmant\u0103 - mai mult de o dat\u0103 pe lun\u0103 - care este mare pentru o industrie matur\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 146, "label": "146", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eO \u201ecultur\u0103 a siguran\u021bei\u201d slab\u0103 \u00een cadrul NRC \u00een sine \u00eempiedic\u0103 o supraveghere eficient\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 147, "label": "147", "shape": "dot" 22"}, "id": 152, "label": "152", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eSprijinul energiei nucleare de c\u0103tre guvern este rezultatul unui lobby special din partea industriei."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 153, "label": "153", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003e* \u021aint\u0103 pentru terorism (cum sunt toate sursele centralizate de producere a energiei)."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 154, "label": "154", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003ePrin urmare, sunt necesare solu\u021bii costisitoare pentru a proteja Mama P\u0103m\u00e2nt de efectele devastatoare ale energiei nucleare."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 155, "label": "155", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eReprocesarea combustibilului uzat d\u0103 na\u0219tere la plutoniu care este probabil s\u0103 fie folosit \u00een bombe."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 156, "label": "156", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eR\u0103cirea acestor opera\u021biuni necesit\u0103 adesea o mul\u021bime de ap\u0103, a c\u0103rei extragere \u0219i eliberare pot afecta fauna acvatic\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 157, "label": "157", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: nuclear energy\u003cbr\u003eDe\u0219i nicio tehnologie nu poate fi perfect sigur\u0103, energia nuclear\u0103 este o tehnologie \u00een mod inerent riscant\u0103, iar reducerea la minimum a riscurilor necesit\u0103 standarde \u0219i practici stricte de siguran\u021b\u0103."}, {"color": "#f44336", "font": {"color": "# 103 un astfel de salariu minim ca cel la care se face referire ar fi \u00een vreun fel interpretat ca un salariu de trai\u201d."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 220, "label": "220", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDac\u0103 salariul muncitorului cre\u0219te la 15 USD, c\u00e2\u0219tigurile anuale s-ar muta la 31.200 USD pe an pentru o s\u0103pt\u0103m\u00e2n\u0103 de 40 de ore."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 221, "label": "221", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eSprijinul public pentru o majorare a salariului minim este cople\u0219itor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 222, "label": "222", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eNou\u0103zeci \u0219i doi la sut\u0103 dintre democra\u021bi, 71 la sut\u0103 dintre independen\u021bi \u0219i 43 la sut\u0103 dintre republicani au declarat c\u0103 sus\u021bin cre\u0219terea salariului minim federal la 9,00 dolari pe or\u0103 \u0219i indexarea cre\u0219terilor viitoare la infla\u021bie."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 223, "label": "223", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAparent, nu \u0219ti\u021bi c\u0103 are loc criza \u00eemprumuturilor pentru studen\u021bi, \u00een care datoria la \u00eemprumuturile studen\u021be\u0219ti este la un nivel record de exponen\u021bi \u0219i mul\u021bi studen\u021bi nu pot pl\u0103ti."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 224, "label": "224", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen 2014, sus\u021bin\u0103torii salariului minim au citat organiza\u021biile de \u0219tiri care au raportat c\u0103 statul cu cel mai mare salariu minim a generat mai multe locuri de munc\u0103 dec\u00e2t restul Statelor Unite."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 225, "label": "225", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u201eProblema este c\u0103 salariul ar trebui s\u0103 fie \u00eentr-adev\u0103r un pre\u021b la care vinzi serviciul \u2013 ar trebui s\u0103 reflecte productivitatea, precum \u0219i oferta \u0219i cererea, atunci c\u00e2nd sunt stabilite de pia\u021b\u0103\u201d, a spus Orrenius."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 226, "label": "226", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eReich spune c\u0103 argumentele multora care se opun cre\u0219terii salariului minim se bazeaz\u0103 pe un \u201emodel de baz\u0103 Econ 101\u201d care nu reprezint\u0103 cu exactitate realit\u0103\u021bile nuan\u021bate ale industriilor care angajeaz\u0103 muncitori cu salariul minim."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 227, "label": "227", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eMai mul\u021bi bani c\u00e2\u0219tiga\u021bi \u00eenseamn\u0103 mai mul\u021bi bani \u00eenapoia\u021bi \u00een economie pe m\u0103sur\u0103 ce oamenii \u00eei cheltuiesc."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 228, "label": "228", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eVa ajuta economia, va ajuta muncitorii \u0219i chiar va ajuta afacerile."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 229, "label": "229", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen februarie, pre\u0219edintele Obama a ridicat salariul minim la 10,10 dolari numai pentru contractorii federali."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 230, "label": "230", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eEi nu au g\u0103sit efecte negative asupra angaj\u0103rii de la un salariu minim mai mare."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 231, "label": "231", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCentrul de Performan\u021b\u0103 Economic\u0103 nu a g\u0103sit niciun impact vizibil asupra nivelului de ocupare a for\u021bei de munc\u0103 din cre\u0219terea salariilor, \u00een timp ce Comisia de Salarizare Sc\u0103zut\u0103 a constatat c\u0103 angajatorii \u0219i-au redus rata de angajare \u0219i orele de angajare a angaja\u021bilor \u0219i a g\u0103sit modalit\u0103\u021bi de a-i determina pe lucr\u0103torii actuali s\u0103 fie mai productivi (\u00een special companiile de servicii)."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 232, "label": "232", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eLucr\u0103torilor cu norm\u0103 par\u021bial\u0103 care ob\u021bin salariul minim li s-ar putea oferi oportunitatea cu norm\u0103 \u00eentreag\u0103 de a ajuta un angajator s\u0103 economiseasc\u0103 costul angaj\u0103rii \u0219i form\u0103rii de noi angaja\u021bi."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 233, "label": "233", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCre\u0219terea salariului minim \u00eenseamn\u0103 c\u0103 unii dintre ace\u0219ti oameni ar fi capabili s\u0103 se \u00eentre\u021bin\u0103 mai bine f\u0103r\u0103 a se sprijini at\u00e2t de mult pe programele sociale \u0219i acest lucru ar \u00eensemna \u00een cele din urm\u0103 impozite mai mici sau o realocare a acelor fonduri pentru a sprijini alte nevoi."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 234, "label": "234", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePropunerea pre\u0219edintelui ar cre\u0219te venitul anual cu 3.500 de dolari pentru un lucr\u0103tor cu salariu minim cu norm\u0103 \u00eentreag\u0103."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 235, "label": "235", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAngaja\u021bii califica\u021bi care lucreaz\u0103 sub stimulentele potrivite pot genera beneficii enorme pentru investitori prin cre\u0219terea productivit\u0103\u021bii \u0219i satisfac\u021bia clien\u021bilor, doar pentru \u00eenceput."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 236, "label": "236", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDar nimeni nu sus\u021bine c\u0103 cre\u0219terea salariului minim cre\u0219te num\u0103rul de \u0219omeri care \u00ee\u0219i g\u0103sesc locuri de munc\u0103."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 237, "label": "237", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eUn raport din 2015 al Alian\u021bei pentru o Societate Just\u0103, a constatat c\u0103 \u201esalariul minim federal de 7,25 dolari pe or\u0103 reprezint\u0103 mai pu\u021bin de jum\u0103tate din salariul de trai pentru un singur adult\u201d, iar un muncitor care se \u00eentre\u021bine numai pe sine ar trebui s\u0103 lucreze 93 de ore pe s\u0103pt\u0103m\u00e2n\u0103 la salariul minim federal pentru a-\u0219i face rostul \u201esau s\u0103 sar\u0103 peste nevoi precum mese sau medicamente\u201d."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 238, "label": "238", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen 2012, cel mai bogat 1% din popula\u021bia SUA a c\u00e2\u0219tigat 22,83% din venitul total \u00eenainte de impozitare al na\u021biunii, rezult\u00e2nd cel mai mare decalaj dintre boga\u021bi \u0219i s\u0103raci din anii 1920."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 239, "label": "239", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eEste un mit c\u0103 salariul minim este doar pentru adolescen\u021bi \u0219i pentru lucr\u0103torii de nivel \u00eencep\u0103tor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 240, "label": "240", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCercet\u0103rile sugereaz\u0103 c\u0103 o cre\u0219tere a salariului minim ar putea avea un mic efect stimulativ asupra economiei, deoarece lucr\u0103torii cu salarii mici \u00ee\u0219i cheltuiesc veniturile suplimentare, cresc\u00e2nd cererea \u0219i cre\u0219terea locurilor de munc\u0103 \u0219i oferind ajutor \u00een ceea ce prive\u0219te locurile de munc\u0103. \""}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 241, "label": "241", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAdolescen\u021bii care tr\u0103iesc \u00een s\u0103r\u0103cie au de dou\u0103 ori mai multe \u0219anse s\u0103 rateze trei sau mai multe zile de \u0219coal\u0103 pe lun\u0103 \u00een compara\u021bie cu cei care nu o fac; astfel, cre\u0219terea salariului minim \u0219i scoaterea familiilor din s\u0103r\u0103cie ar \u00eensemna c\u0103 copiii vor lipsi mai pu\u021bine zile de \u0219coal\u0103."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 242, "label": "242", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e29 de state plus Districtul Columbia (DC) au un salariu minim mai mare dec\u00e2t salariul minim federal."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 243, "label": "243", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eMit: Cre\u0219terea salariului minim cu bac\u0219i\u0219 federal (2,13 dolari pe or\u0103 din 1991) ar d\u0103una restaurantelor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 244, "label": "244", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCu toate acestea, \u00een apelul s\u0103u de a cre\u0219te treptat minimul federal actual, pre\u0219edintele Obama a cerut \u0219i ca acesta s\u0103 se ajusteze automat cu infla\u021bia."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 245, "label": "245", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePotrivit James K. Galbraith, PhD, profesor de guvernare la Universitatea Texas din Austin, \u201e[b] deoarece veniturile din salarii \u0219i impozitele pe venit ar cre\u0219te [ca urmare a unei cre\u0219teri a salariului minim], deficitul federal ar sc\u0103dea.\u201d"}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 246, "label": "246", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eO cre\u0219tere a salariului minim va pune mai mul\u021bi bani \u00een buzunarele mai multor familii, care vor fi cheltui\u021bi pe bunuri \u0219i servicii, stimul\u00e2nd cre\u0219terea economic\u0103 la nivel local \u0219i na\u021bional."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 247, "label": "247", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eSondajele efectuate din februarie 2013, c\u00e2nd pre\u0219edintele Obama a cerut pentru prima dat\u0103 Congresului s\u0103 majoreze salariul minim, au ar\u0103tat \u00een mod constant c\u0103 o majoritate cov\u00e2r\u0219itoare a americanilor sus\u021bin o cre\u0219tere."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 248, "label": "248", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCre\u0219terea salariului minim federal este o parte important\u0103 a consolid\u0103rii economiei."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 249, "label": "249", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDeoarece firmelor li se permite s\u0103 pl\u0103teasc\u0103 salarii la nivelul s\u0103r\u0103ciei pentru 3,6 milioane de oameni -- 5% din for\u021ba de munc\u0103 -- ace\u0219ti lucr\u0103tori trebuie s\u0103 se bazeze pe programele federale de sprijinire a veniturilor."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 250, "label": "250", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDe fapt, cele mai actuale cercet\u0103ri arat\u0103 c\u0103 un salariu minim mai mare cre\u0219te \u0219omajul; cu toate acestea, realitatea economic\u0103 mai important\u0103 este c\u0103 un salariu minim mai mare cre\u0219te costul for\u021bei de munc\u0103 slab calificate."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 251, "label": "251", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen modelele standard de pie\u021be competitive, orice lucru care cre\u0219te artificial pre\u021bul for\u021bei de munc\u0103 va reduce cererea pentru aceasta, iar primii care \u00ee\u0219i vor pierde locurile de munc\u0103 vor fi muncitorii cel mai pu\u021bin califica\u021bi."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 252, "label": "252", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eSanderson \u0219i mul\u021bi al\u021bi economi\u0219ti \u0219i exper\u021bi \u00een politici publice se tem de o serie de consecin\u021be nedorite dac\u0103 salariul minim este crescut de la nivelul actual la 10,10 dolari pe or\u0103, a\u0219a cum a propus pre\u0219edintele Barack Obama."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 253, "label": "253", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eEi estimeaz\u0103 \u00een mod obi\u0219nuit c\u0103 o cre\u0219tere a salariului cu 10 la sut\u0103 va reduce ocuparea for\u021bei de munc\u0103 a adolescen\u021bilor cu aproximativ 1 p\u00e2n\u0103 la 3 la sut\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 254, "label": "254", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00centre timp, economi\u0219ti precum Jess Rothstein de la Universitatea din California, Berkeley, sus\u021bin c\u0103, atrag\u00e2nd mai mul\u021bi oameni pe pia\u021ba muncii, EITC de fapt \u00eempinge salariile \u00een jos."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 255, "label": "255", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eUnele companii vor putea absorbi costurile crescute cu for\u021ba de munc\u0103, \u00een timp ce altele, cu marje de profit reduse, \u00ee\u0219i pot reduce for\u021ba de munc\u0103 sau \u00ee\u0219i pot cre\u0219te pre\u021burile."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 256, "label": "256", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDac\u0103 angajatorii au putere de monopson ca cump\u0103r\u0103tori de for\u021b\u0103 de munc\u0103 \u0219i sunt capabili s\u0103 stabileasc\u0103 salarii, de exemplu, ei pot men\u021bine salariul sub rata competitiv\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 257, "label": "257", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePrincipalul impact negativ poten\u021bial al cre\u0219terii salariului minim este pierderea a aproape 500.000 de locuri de munc\u0103, care rezult\u0103 \u00een  "label": "292", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen mod similar , Marco Rubio a protestat c\u0103 \" dac\u0103 ridici salariul minim , vei face oamenii mai scumpi dec\u00e2t o ma\u0219in\u0103rie \" ."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 293, "label": "293", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAceast\u0103 tendin\u021b\u0103 a fost mai pronun\u021bat\u0103 \u00een sectoarele fast-food \u0219i hotelier \u2013 mai mult de 80% dintre proprietarii de fast-food franciza\u021bi au declarat c\u0103 ar avea mai multe \u0219anse s\u0103 reduc\u0103 angaj\u0103rile, fa\u021b\u0103 de 58% dintre proprietarii de restaurante non-fast-food."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 294, "label": "294", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen plus , majoritatea a considerat \u0219omajul ca fiind un dezavantaj poten\u021bial moderat al cre\u0219terii pe care o sus\u021bineau ."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 295, "label": "295", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eBastian crede c\u0103 afacerile vor c\u0103uta s\u0103 externalizeze \u00een \u021b\u0103ri str\u0103ine cu salarii competitive sau s\u0103 \u00eenlocuiasc\u0103 angaja\u021bii cu tehnologie."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 296, "label": "296", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen general, dac\u0103 costurile de trai cresc, atunci s-ar putea s\u0103 ajungem \u00eenapoi de unde am \u00eenceput."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 297, "label": "297", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u201eLocuri de munc\u0103 cu salariu minim sunt destinate elevilor de liceu!\u201d"}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 298, "label": "298", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eP\u0103rerea mea este c\u0103 pia\u021ba muncii se schimb\u0103 \u00een moduri care fac ca major\u0103rile uria\u0219e ale salariului minim, precum cea sus\u021binut\u0103 de mi\u0219carea Lupta pentru 15, s\u0103 fie foarte periculoase."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 299, "label": "299", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAjunge doar la jum\u0103tate din cei pe care inten\u021bioneaz\u0103 s\u0103 \u00eei ajute \u0219i nu \u00eentr-un mod pozitiv."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 300, "label": "300", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAm un partener de afaceri care a spus c\u0103 va trebui s\u0103-\u0219i creasc\u0103 pre\u021burile cu 40 la sut\u0103 dac\u0103 se \u00eent\u00e2mpl\u0103. \u201d"}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 301, "label": "301", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePrin urmare, este mai bine s\u0103 l\u0103sa\u021bi pia\u021ba s\u0103-\u0219i urmeze cursul \u0219i s\u0103 permite\u021bi \u00eentreprinderilor s\u0103 \u00ee\u0219i creasc\u0103 treptat salariile de la sine."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 302, "label": "302", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eNgoussou spune c\u0103 afacerile ca a lui au nevoie de o reducere a impozitelor \u0219i taxelor."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 303, "label": "303", "shape": "dot", "title": "\u003cb\u003eCONTRA\u0  minimum wage\u003cbr\u003eOrdonarea companiilor s\u0103 pl\u0103teasc\u0103 mai mult lucr\u0103torilor de la nivel de baz\u0103 le va face s\u0103 angajeze mai pu\u021bini dintre ei \u0219i s\u0103 ia \u00een considerare \u00eenlocuirea mai multor lucr\u0103tori cu robo\u021bi sau computere."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 309, "label": "309", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eSau, cu to\u021bii vom pl\u0103ti mai mult pentru proviziile noastre."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 310, "label": "310", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen sectorul de afaceri, preocup\u0103rile includ cre\u0219terea preconizat\u0103 a costurilor de desf\u0103\u0219urare a afacerilor, amenin\u021b\u0103rile la adresa profitabilit\u0103\u021bii, nivelurile \u00een cre\u0219tere ale \u0219omajului (\u0219i cheltuielile guvernamentale mai mari ulterioare pentru beneficiile sociale, cre\u0219terea cotelor de impozitare) \u0219i posibilele efecte secundare asupra salariilor lucr\u0103torilor mai experimenta\u021bi care ar putea c\u00e2\u0219tiga deja noul salariu minim legal mai mult sau."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 311, "label": "311", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eO cre\u0219tere a salariului minim este pur \u0219i simplu o modalitate ineficient\u0103 de a ajuta americanii s\u0103 ias\u0103 din s\u0103r\u0103cie."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 312, "label": "312", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eLa momentul \u00een care a fost adoptat\u0103, oponen\u021bii au promis c\u0103 va ucide locuri de munc\u0103 \u0219i, \u00een cele din urm\u0103, va r\u0103ni muncitorii pe care a fost proiectat s\u0103 \u00eei ajute."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 313, "label": "313", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDin punct de vedere istoric, scepticismul economi\u0219tilor \u00ee\u0219i are r\u0103d\u0103cinile \u00een \u00eengrijorarea c\u0103 limitele salariale reduc ocuparea for\u021bei de munc\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 314, "label": "314", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePentru oamenii care lucreaz\u0103 \u0219i depind de guvern pentru un fel de subven\u021bie, cum ar fi timbrele alimentare (programul de alimenta\u021bie \u0219i nutri\u021bie prin USDA), ei ar pierde cea mai mare parte a asisten\u021bei care NU ar compensa pierderea beneficiilor."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 315, "label": "315", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eIdeea c\u0103 salariile nu s-ar ajusta \u00een mod natural \u0219i c\u0103 toat\u0103 lumea de la acel cap\u0103t al grilei salariale nu ar ajunge s\u0103 fac\u0103 mai mult este de r\u00e2s."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 316, "label": "316", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eEi au contestat concluziile domnilor Card \u0219i Krueger pentru New Jersey \u0219i au sus\u021binut c\u0103 o compara\u021bie \u00eentre diferite state de-a lungul timpului a ar\u0103tat c\u0103 salariile minime mai mari afecteaz\u0103 locurile de munc\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 317, "label": "317", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eUn alt studiu din 2011 al lui Sen, Rybczynski \u0219i Van De Waal a constatat c\u0103 \u201eo cre\u0219tere cu 10% a salariului minim este corelat\u0103 \u00een mod semnificativ cu o sc\u0103dere cu 3-5% a angaj\u0103rii adolescen\u021bilor\u201d."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 318, "label": "318", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003e\u00cen mod clar, profesioni\u0219tii nu sunt la fel de valoro\u0219i ca atunci c\u00e2nd au fost \u00eencepute legile care guverneaz\u0103 salariul minim."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 319, "label": "319", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003ePierderile de locuri de munc\u0103 ar putea ap\u0103rea ca urmare a salariilor mai mari care pun o presiune mai mare asupra companiilor, ceea ce ar putea duce la t\u0103ierea locurilor de munc\u0103, reducerea orelor de munc\u0103 \u0219i la alte metode de economisire a banilor companiei."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 320, "label": "320", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eAdev\u0103rul este c\u0103 legile privind salariul minim blocheaz\u0103 tinerii de pe pia\u021ba muncii."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 321, "label": "321", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eThomas Grennes , MA , profesor emerit la Universitatea de Stat din Carolina de Nord , \u0219i Andris Strazds , MSc , lector la Stockholm School of Economics din Riga ( Letonia ) , au declarat: \u201eefectul net al salariilor minime mai mari ar fi nefavorabil pentru gospod\u0103riile s\u0103race, chiar dac\u0103 nu exist\u0103 pierderi de locuri de munc\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 322, "label": "322", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDe ce s\u0103 arunci mai mul\u021bi bani \u00een cineva care se mul\u021bume\u0219te s\u0103 r\u0103m\u00e2n\u0103 pe loc."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 323, "label": "323", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eMit: Cre\u0219terea salariului minim cu bac\u0219i\u0219 federal (2,13 dolari pe or\u0103 din 1991) ar duce la pierderea locurilor de munc\u0103 \u00een restaurante."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 324, "label": "324", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eDesigur, acest lucru nu \u00eenseamn\u0103 c\u0103 cre\u0219terea salariului minim nu ar fi foarte benefic\u0103 pentru cei care \u00eel c\u00e2\u0219tig\u0103, dar, \u00een cele din urm\u0103, nu \u00eei ajut\u0103 pe cei care nu au deja un loc de munc\u0103 pentru \u00eenceput."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 325, "label": "325", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eConcuren\u021ba se va intensifica: dac\u0103 salariul minim cre\u0219te, persoanele prea calificate vor lupta pentru pozi\u021bii cu salariul minim, \u00eemping\u00e2nd lucr\u0103torii mai tineri \u0219i f\u0103r\u0103 experien\u021b\u0103 din competi\u021bie \u0219i r\u0103pindu-le oportunitatea de a c\u00e2\u0219tiga experien\u021b\u0103 \u0219i cuno\u0219tin\u021be pentru a-\u0219i construi un CV \u0219i a intra \u00een for\u021ba de munc\u0103."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 326, "label": "326", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eNBC News a descoperit c\u0103 pre\u021bul unei ce\u0219ti de cafea a crescut cu 10 p\u00e2n\u0103 la 20% \u00een Oakland, California, dup\u0103 o cre\u0219tere a salariului minim de 36% \u00een ora\u0219, la 12,25 dolari."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 327, "label": "327", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eJames Dorn, PhD, Senior Fellow la Institutul Cato, a declarat c\u0103 o cre\u0219tere cu 10% a salariului minim \u201econduce la o sc\u0103dere cu 1 p\u00e2n\u0103 la 3% a angaj\u0103rii lucr\u0103torilor slab califica\u021bi\u201d pe termen scurt \u0219i \u201ela o sc\u0103dere mai mare pe termen lung\u201d."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 328, "label": "328", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eMai pu\u021bine angaj\u0103ri: dac\u0103 afacerile trebuie s\u0103 pl\u0103teasc\u0103 salariul minim mai mult angaja\u021bilor, nu \u00ee\u0219i pot permite s\u0103 angajeze at\u00e2t de mul\u021bi angaja\u021bi."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 329, "label": "329", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eCre\u0219terea salariului minim federal ar d\u0103una \u00een mod dispropor\u021bionat celor mai s\u0103race zone ale Statelor Unite."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 330, "label": "330", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eUnii angaja\u021bi ai organiza\u021biei nonprofit din zona Seattle, Full Life Care, au cerut o reducere a orelor dup\u0103 ce a fost majorat salariul minim, invoc\u00e2nd \u00eengrijorarea c\u0103 cre\u0219terea va \u00eensemna c\u0103 \u00ee\u0219i vor pierde subven\u021biile pentru locuin\u021be, dar \u00eenc\u0103 nu \u00ee\u0219i pot permite chirii la pre\u021bul pie\u021bei."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 331, "label": "331", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: minimum wage\u003cbr\u003eNu este adev\u0103rat: muncitorul obi\u0219nuit cu salariul minim nu este un elev de liceu care c\u00e2\u0219tig\u0103 bani de buzunar \u00een weekend."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 332, "label": "332", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eDepartamentul de Educa\u021bie al SUA sus\u021bine c\u0103 utilizarea obligatorie a \u00eembr\u0103c\u0103mintei standardizate reduce violen\u021ba \u00een \u0219coal\u0103."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 333, "label": "333", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eTinerii au nevoia de a se integra, de a face parte din mediul lor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 334, "label": "334", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u2022 Elevii au mai pu\u021bin timp s\u0103 se preg\u0103teasc\u0103 \u0219i s\u0103 se preg\u0103teasc\u0103 pentru \u0219coal\u0103 diminea\u021ba."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 335, "label": "335", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cemi vin \u00een minte costume de clovn cu dungi, p\u0103l\u0103rii prostu\u021be, pantaloni scur\u021bi largi care scot la iveal\u0103 organele genitale \u0219i cravate scurte."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 336, "label": "336", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u201eElevii mai boga\u021bi pot de\u021bine fiecare accesoriu de uniform\u0103 \u0219i pot purta br\u0103\u021b\u0103ri de designer sau pantofi care se lumineaz\u0103; al\u021bii \u2013 dac\u0103 au uniforme \u2013 au unele foarte simple."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 337, "label": "337", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u0218colile spun, de asemenea, c\u0103 uniformele ajut\u0103 la stabilirea unor standarde academice \u00eenalte."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 338, "label": "338", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eIdeea este c\u0103 elevii nu pot pleca cu u\u0219urin\u021b\u0103 de la \u0219coal\u0103 f\u0103r\u0103 a fi imediat identifica\u021bi de publicul larg colaborator, re\u021binu\u021bi \u0219i preda\u021bi \u0219colii lor pentru pedeaps\u0103."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 339, "label": "339", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eU\u0219ureaz\u0103 diminea\u021ba p\u0103rin\u021bilor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 340, "label": "340", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eCele mai multe probleme legate de aplicarea regulilor uniforme \u00een SUA se datoreaz\u0103 faptului c\u0103 uniforma este voluntar\u0103 sau studen\u021bilor li se permite s\u0103 renun\u021be la ea."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 341, "label": "341", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eElevii sunt adesea at\u00e2t de concentra\u021bi pe garderoba lor \u00eenc\u00e2t le distrage aten\u021bia de la \u00eenv\u0103\u021bare."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 342, "label": "342", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eP\u0103rin\u021bii doresc ca copiii lor s\u0103 fie educa\u021bi \u0219i s\u0103 se comporte bine; un studiu din 1994 demonstreaz\u0103 c\u0103 elevii care poart\u0103 uniform\u0103 la \u0219coal\u0103 sunt bine percepu\u021bi de profesori."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 343, "label": "343", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eChiar \u0219i din primele clase, copiii simt presiunea de a se conforma standardelor idealizate de \u00eembr\u0103c\u0103minte, ceea ce poate dep\u0103\u0219i posibilit\u0103\u021bile familiei lor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 344, "label": "344", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cenc\u0103 din secolul al XVI-lea, uniformele au fost folosite \u0219i au devenit mai specifice pe m\u0103sur\u0103 ce diversele tendin\u021be de mod\u0103 au devenit nedorite universit\u0103\u021bii."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 345, "label": "345", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cen cercetarea mea, studen\u021bii au indicat c\u0103 a existat o reducere a h\u0103r\u021buirii pe care au v\u0103zut-o \u00een mod special la \u0219coala lor."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 346, "label": "346", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u0218i instan\u021bele au permis \u0219colilor s\u0103 adopte politici care cer elevilor s\u0103 se conformeze codurilor vestimentare."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 347, "label": "347", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eAcum, pentru c\u0103 liceele din SUA le permit copiilor s\u0103 poarte orice haine doresc (p\u00e2n\u0103 la un punct), nu exist\u0103 nicio disciplin\u0103 cu elevii."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 348, "label": "348", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eTema 3: Uniformele vor facilita identificarea celor care nu sunt de la \u0219coal\u0103 \u0219i, prin urmare, vor cre\u0219te securitatea/siguran\u021ba."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 349, "label": "349", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eSus\u021bin\u0103torii sus\u021bin \u00een continuare c\u0103 uniformele \u00eembun\u0103t\u0103\u021besc prezen\u021ba."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 350, "label": "350", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eC\u00e2nd vorbim despre siguran\u021b\u0103 \u0219i supravegherea studen\u021bilor, devine perfect u\u0219or s\u0103 \u00eei gestion\u0103m \u00een excursii \u0219i ie\u0219iri."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 351, "label": "351", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cen timpul unui interviu telefonic din aprilie 1996 , Dick Van Der Laan , purt\u0103torul de cuv\u00e2nt al districtului \u015fcolar unificat din Long Beach , a declarat c\u0103 singura schimbare care a avut loc \u00een district , \u00eenainte de rezultatele \u00eembun\u0103t\u0103\u0163ite ale disciplinei , a fost implementarea politicii uniforme ."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 352, "label": "352", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003ePurtarea unei uniforme cinci zile pe s\u0103pt\u0103m\u00e2n\u0103 i-ar putea face pe studen\u021bi s\u0103-\u0219i aprecieze mai mult moda de weekend -- poate suficient pentru a avea grij\u0103 de ei!"}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 353, "label": "353", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eUniformele \u0219colare \u00eendep\u0103rteaz\u0103 ace\u0219ti factori din mediul social din \u0219coal\u0103, eliber\u00e2nd astfel elevii de presiunea de a se integra."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 354, "label": "354", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eOamenii care sunt pentru uniforme spun c\u0103 promoveaz\u0103 conformitatea social\u0103, astfel \u00eenc\u00e2t cei mai pu\u021bin de f\u0103cut nu trebuie s\u0103 fie presa\u021bi s\u0103 \u021bin\u0103 pasul cu contemporanii lor \u00eenst\u0103ri\u021bi."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 355, "label": "355", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eElevii \u00een uniform\u0103 se simt uni\u021bi \u0219i conecta\u021bi."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 356, "label": "356", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eEste mai logic s\u0103 te exprimi doar prin ac\u021biuni."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 357, "label": "357", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cen Detroit, un b\u0103iat de 15 ani a fost \u00eempu\u0219cat pentru pantofii de baschet de 86 de dolari."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 358, "label": "358", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eOficialii \u0219colii din Chicago au constatat o sc\u0103dere a violen\u021bei bandelor dup\u0103 ce au adoptat uniforme \u0219colare."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 359, "label": "359", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eDe\u0219i uniformele au fost un pilon de baz\u0103 al \u0219colilor private, \u0219colile publice nu s-au urcat pe val p\u00e2n\u0103 \u00een 1994, c\u00e2nd sorii nu pot continua cu activit\u0103\u021bile \u0219colare obi\u0219nuite din cauza interferen\u021bei cauzate de \u00eembr\u0103c\u0103mintea unui elev."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 370, "label": "370", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u201ePersonal m\u0103 simt m\u00e2ndru c\u0103 m\u0103 plimb \u00een uniform\u0103, \u00een ciuda a ceea ce ar putea spune oamenii.\u201d"}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 371, "label": "371", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eCostul mediu de \u00eembr\u0103c\u0103minte per copil \u00een \u0219colile cu uniform\u0103 de elev este semnificativ mai mic dec\u00e2t cel din \u0219colile f\u0103r\u0103 uniforme... Alese de fiecare \u0219coal\u0103, uniformele \u0219colare ofer\u0103 elevilor o identitate \u0219colar\u0103, \u00eent\u0103resc \u0219coala \u0219i spiritul \u0219i m\u00e2ndria individual\u0103 - nu spre deosebire de modul \u00een care o uniform\u0103 de echip\u0103 de atletism construie\u0219te identitatea echipei, moralul \u0219i stima de sine."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 372, "label": "372", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eExist\u0103 numeroase moduri diferite \u00een care elevii \u00ee\u0219i pot ad\u0103uga nota personal\u0103 uniformelor \u0219colare, cum ar fi un stil de p\u0103r diferit, utilizarea unei oje grozave, ad\u0103ugarea de accesorii precum nasturi, \u0219osete, e\u0219arfe \u0219i lista poate continua."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 373, "label": "373", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u201eUniformele ofer\u0103 \u0219colilor un sentiment de identitate \u0219i coeziune\u201d, a spus autorul \u0219i ist hape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u0218colile din Birmingham au raportat o sc\u0103dere a incidentelor cu arme \u0219i droguri, iar \u0219colile din Houston au raportat o sc\u0103dere a criminalit\u0103\u021bii violente."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 380, "label": "380", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cen plus, tendin\u021bele modei care distrag aten\u021bia \u0219i \u00eembr\u0103c\u0103mintea simbol al statutului sunt eliminate, permi\u021b\u00e2nd studen\u021bilor s\u0103 se concentreze mai mult pe obiectivele lor academice."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 381, "label": "381", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eO treime dintre elevi au raportat beneficii pentru purtarea uniformelor \u0219colare."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 382, "label": "382", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u201eDac\u0103 o simpl\u0103 schimbare de \u021binut\u0103 poate influen\u021ba pozitiv mai mult de 30%, sau chiar 25% din popula\u021bia elevilor unei \u0219coli, atunci poate c\u0103 administratorii, profesorii, studen\u021bii \u0219i membrii comunit\u0103\u021bii merit\u0103 efortul\u201d, a spus Sanchez."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 383, "label": "383", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eComunitatea local\u0103 \u0219tie unde este acel copil."}, {"color": "#4caf50", "font": {"color": "#222222"}, "id": 384, "label": "384", "shape": "dot", "title": "\u003cb\u003ePRO\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eEi cred c\u0103 elevii se simt mai profesioni\u0219ti \u0219i simt c\u0103 apar\u021b ape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u00cen lipsa argumentelor \u00een favoarea, uniformele devin o c\u0103ma\u0219\u0103 de for\u021b\u0103 care este for\u021bat\u0103 asupra celor care le sup\u0103r\u0103 de dragul uciderii spiritului lor."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 457, "label": "457", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eCred c\u0103 nu ar trebui s\u0103 mai purt\u0103m uniforme, copiii nu au libertatea de a purta ceea ce \u00ee\u0219i doresc \u0219i uniformele cost\u0103 uneori mai mult dec\u00e2t ceea ce vor familiile s\u0103 pl\u0103teasc\u0103 doar o uniform\u0103!"}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 458, "label": "458", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eEste evident c\u0103 sunt multe lucruri pe care le po\u021bi spune \u00eempotriva uniformelor \u0219colare ."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 459, "label": "459", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003e\u0218colile din Finlanda sunt \u00een topul clasamentului interna\u021bional \u0219i nu au uniform\u0103 \u0219colar\u0103; \u00een timp ce Marea Britanie are uniformele f\u0103r\u0103 rezultate uimitoare ."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 460, "label": "460", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u003cbr\u003eEl a purtat o pereche de pantaloni r\u0103ma\u0219i din anul \u0219colar precedent \u0219i a fost considerat a fi neconform deoarece pantalonii erau prea decolora\u021bi ( 1 ) ."}, {"color": "#f44336", "font": {"color": "#222222"}, "id": 461, "label": "461", "shape": "dot", "title": "\u003cb\u003eCONTRA\u003c/b\u003e\u003cbr\u003eTopic: school uniforms\u00
